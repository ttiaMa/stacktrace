  - id: repository-work
    title: Repository-wide work
    start: 2026-06-12
    model: gpt
    harness: codex
    category: code
    notes: |
      A new daily workflow for implementation, tests and review.
      Overlapped with the previous harness before making the switch.
    tags: [daily-driver, agents]

  - id: harness-only
    title: Keeping the editor around
    start: 2026-07-05
