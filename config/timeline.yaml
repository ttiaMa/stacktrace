version: 1
site:
  title: My evolving AI stack
  description: A personal record of the models, tools and experiments behind the work.
  author: Your name

# IDs and names are free-form. Provider is optional and only supplies a color.
models:
  sonnet:
    name: Claude Sonnet
    provider: anthropic
    icon: '✳'
  gpt:
    name: GPT
    provider: openai
    icon: '◎'
  gemini:
    name: Gemini
    provider: google
    icon: '✧'
  local:
    name: Local model
    provider: local
    icon: '◇'

harnesses:
  cursor:
    name: Cursor
    icon: ide
    color: '#b49ace'
  claude-code:
    name: Claude Code
    icon: terminal
    color: '#d9ac80'
  codex:
    name: Codex CLI
    icon: terminal
    color: '#85b5ae'
  chatgpt:
    name: ChatGPT
    icon: chat
    color: '#85b5ae'
  studio:
    name: AI Studio
    icon: web
    color: '#90aac8'
  ollama:
    name: Ollama
    icon: terminal
    color: '#b5b986'

categories:
  code: {name: Code, icon: code}
  chat: {name: Chat, icon: chat}
  research: {name: Research, icon: research}
  experiments: {name: Experiments, icon: experiment}

entries:
  - id: editor-first
    title: The editor-first workflow
    start: 2026-01-05
    end: 2026-04-18
    model: sonnet
    harness: cursor
    category: code
    notes: |
      Started with an assistant inside the editor. Small changes, quick feedback,
      and a lot of back-and-forth before trusting larger refactors.
    tags: [daily-driver, frontend]

  - id: thinking-partner
    title: A thinking partner
    start: 2026-01-20
    model: gpt
    harness: chatgpt
    category: chat
    notes: Architecture discussions, writing and a second opinion before implementation.
    tags: [planning, writing]

  - id: terminal-agents
    title: Moving into the terminal
    start: 2026-03-10
    end: 2026-07-04
    model: sonnet
    harness: claude-code
    category: code
    notes: |
      Tried an agent with access to the whole repository. Kept the editor workflow
      running alongside it while comparing review effort and results.
    tags: [agents, refactoring]

  - id: deeper-research
    title: A second lens on research
    start: 2026-04-02
    model: gemini
    harness: studio
    category: research
    notes: Reading technical material and comparing approaches before committing to one.
    tags: [research]

  - id: local-weekends
    title: Local weekend experiments
    start: 2026-05-15
    end: 2026-06-21
    model: local
    harness: ollama
    category: experiments
    notes: Exploring what works offline on the hardware already on my desk.
