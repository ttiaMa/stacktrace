# Pinned stable release; no local build is required.
services:
  stacktrace:
    image: ghcr.io/ttiama/stacktrace:0.2.1
    restart: unless-stopped
    expose: ["8080"]
    volumes:
      - type: bind
        source: ./config/timeline.yaml
        target: /config/timeline.yaml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
